<h2>🗑️ Confirmation de Suppression</h2>

<p>Êtes-vous sûr de vouloir supprimer le professeur suivant : <strong>{{ object }}</strong> ?</p>
<p>
    **ATTENTION :** Cela pourrait affecter les enregistrements d'**Emploi du temps** qui y font référence (si vous ajoutez une FK dans le modèle Emploi plus tard).
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" style="background-color: red; color: white; padding: 10px;">Confirmer la suppression</button>
    <a href="{% url 'professeur_list' %}" style="margin-left: 20px;">Annuler</a>
</form>
